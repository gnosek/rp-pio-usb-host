[package]
name = "examples"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "link_detect"
test = false
required-features = ["rp2040"]

[features]
rp2040 = ["embassy-rp/rp2040", "rp-pio-usb-host/rp2040"]
rp235xa = ["embassy-rp/rp235xa", "rp-pio-usb-host/rp235xa"]
rp235xb = ["embassy-rp/rp235xb", "rp-pio-usb-host/rp235xb"]

[dependencies]
cortex-m-rt = "0.7.5"
embassy-rp = { version = "0.10.0", features = ["defmt", "time-driver", "critical-section-impl"] }
embassy-executor = { version = "0.10.0", features = ["defmt", "executor-thread", "platform-cortex-m"] }
embassy-usb-driver = { version = "0.2.2", features = ["defmt"] }
defmt-rtt = "1.3.0"
panic-probe = "1.0.0"
defmt = "1.1.1"
rp-pio-usb-host = { version = "0.1.0", path = "../rp-pio-usb-host" }
