[package]
name = "examples-rp2040"
version = "0.1.0"
edition = "2024"
publish = false


[[bin]]
name = "handshake"
path = "../src/bin/handshake.rs"
test = false
doc = false

[[bin]]
name = "usb_host_keyboard"
path = "../src/bin/usb_host_keyboard.rs"
test = false
doc = false

[dependencies]
cortex-m-rt = "0.7.5"
embassy-executor = { version = "0.10.0", features = ["defmt", "executor-thread", "platform-cortex-m"] }
embassy-usb-host = { version = "0.1.0", features = ["defmt"] }
embassy-rp = { version = "0.10.0", features = ["defmt", "time-driver", "critical-section-impl"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-usb-driver = { version = "0.2.2", features = ["defmt"] }
defmt-rtt = "1.3.0"
panic-probe = "1.0.0"
defmt = "1.1.1"
rp-pio-usb-host = { version = "0.1.0", path = "../../rp-pio-usb-host", features = ["rp2040"] }
static_cell = { version = "2.1.1"}
portable-atomic = { version = "1", default-features = false, features = ["critical-section"] }
