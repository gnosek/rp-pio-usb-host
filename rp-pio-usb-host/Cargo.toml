[package]
name = "rp-pio-usb-host"
version = "0.1.0"
edition = "2024"
description = "Embassy USB host driver for RP2040 and RP235x devices using PIO"
license = "MIT"
documentation = "https://docs.rs/rp-pio-usb-host"
homepage = "https://github.com/gnosek/rp-pio-usb-host"
repository = "https://github.com/gnosek/rp-pio-usb-host"

[features]
rp2040 = ["embassy-rp/rp2040", "rp-pac/rp2040"]
rp235xa = ["embassy-rp/rp235xa", "rp-pac/rp235x"]
rp235xb = ["embassy-rp/rp235xb", "rp-pac/rp235x"]

[package.metadata.docs.rs]
features = ["rp2040"]
default-target = "thumbv6m-none-eabi"

[dependencies]
critical-section = "1.2.0"
embassy-rp = { version = "0.10.0", features = ["defmt", "time-driver", "critical-section-impl"] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-usb-driver = { version = "0.2.2", features = ["defmt"] }
rp-pac = { version = "7.0.0", default-features = false }
fixed = "1.31.0"
pio = "0.3.0"

[dev-dependencies]
cortex-m-rt = "0.7.5"
embassy-executor = { version = "0.10.0", features = ["defmt", "executor-thread", "platform-cortex-m"] }
embassy-usb-host = { version = "0.1.0", features = ["defmt"] }
static_cell = { version = "2.1.1"}
portable-atomic = { version = "1", default-features = false, features = ["critical-section"] }
defmt-rtt = "1.3.0"
panic-probe = "1.0.0"
defmt = "1.1.1"
